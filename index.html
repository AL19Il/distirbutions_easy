<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uniform Distribution</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #203849;
      background: white;
    }

    main {
      max-width: 620px;
      margin: auto;
      padding: 12px;
      --info-width: 145px;
      --gap: 10px;
    }

    p {
      margin: 0 0 8px;
      color: #607585;
      font-size: 12px;
    }

    section {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--info-width);
      align-items: center;
      gap: var(--gap);
      margin-bottom: 10px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    h2 {
      font-size: 12px;
      margin: 0 0 5px;
    }

    .value {
      color: #16876f;
      font-size: 11px;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
    }

    /* Each part stays together, allowing at most two lines. */
    .value span {
      display: inline-block;
      white-space: nowrap;
    }

    .control {
      position: relative;
      width: calc(100% - var(--info-width) - var(--gap));
      height: 24px;
      margin: 0;
    }

    input[type="range"] {
      appearance: none;
      -webkit-appearance: none;
      position: absolute;
      left: calc(8.333333% - 5px);
      width: calc(86.111111% + 10px);
      height: 24px;
      padding: 0;
      margin: 0;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 2px;
      border: none;
      border-radius: 2px;
      background: linear-gradient(
        to right,
        transparent 5px,
        #a8b8c2 5px,
        #a8b8c2 calc(100% - 5px),
        transparent calc(100% - 5px)
      );
    }

    input[type="range"]::-moz-range-track {
      height: 2px;
      border: none;
      border-radius: 2px;
      background: linear-gradient(
        to right,
        transparent 5px,
        #a8b8c2 5px,
        #a8b8c2 calc(100% - 5px),
        transparent calc(100% - 5px)
      );
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      margin-top: -4px;
      border: none;
      border-radius: 50%;
      background: #168aab;
    }

    input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: none;
      border-radius: 50%;
      background: #168aab;
    }

    input[type="range"]:focus-visible {
      outline: 2px solid #168aab;
      outline-offset: 2px;
    }

    @media (max-width: 480px) {
      main {
        padding: 10px;
        --info-width: 125px;
        --gap: 6px;
      }

      .value { font-size: 10px; }
      h2 { font-size: 11px; }
    }
  </style>
</head>

<body>
<main>
  <p>Fixed parameters: a = 0, b = 4</p>

  <div class="control">
    <input
      id="x"
      type="range"
      min="-1"
      max="5"
      step="0.05"
      value="2"
      aria-label="Choose x"
    >
  </div>

  <section>
    <svg
      id="pdf"
      viewBox="0 0 720 265"
      role="img"
      aria-label="Uniform probability density"
    ></svg>

    <div>
      <h2>PDF</h2>
      <div class="value" id="pdfValue"></div>
    </div>
  </section>

  <section>
    <svg
      id="cdf"
      viewBox="0 0 720 265"
      role="img"
      aria-label="Uniform cumulative distribution"
    ></svg>

    <div>
      <h2>CDF</h2>
      <div class="value" id="cdfValue" aria-live="polite"></div>
    </div>
  </section>
</main>

<script>
  const a = 0;
  const b = 4;

  const get = id => document.getElementById(id);
  const format = value => Number(value.toFixed(3)).toString();

  const X = value => 60 + (value + 1) * 620 / 6;
  const Y = (value, maximum) => 220 - value * 180 / maximum;

  function line(x1, y1, x2, y2, color, dashed = false) {
    return `
      <line
        x1="${x1}" y1="${y1}"
        x2="${x2}" y2="${y2}"
        stroke="${color}"
        stroke-width="1.5"
        ${dashed ? 'stroke-dasharray="5 4"' : ""}
      />
    `;
  }

  function text(x, y, content, anchor = "middle") {
    return `
      <text
        x="${x}" y="${y}"
        text-anchor="${anchor}"
        font-family="Arial"
        font-size="18"
        fill="#607585"
      >${content}</text>
    `;
  }

  function axes(maximum, ticks) {
    let result = "";

    ticks.forEach(value => {
      const y = Y(value, maximum);
      result += line(60, y, 680, y, "#e0e8ed");
      result += text(49, y + 5, format(value), "end");
    });

    result += line(60, 220, 680, 220, "#718591");

    for (let value = -1; value <= 5; value++) {
      result += text(X(value), 245, value);
    }

    return result + text(700, 225, "t");
  }

  function update() {
    const x = Number(get("x").value);
    const height = 1 / (b - a);
    const density = x >= a && x <= b ? height : 0;
    const probability = Math.max(0, Math.min(1, (x - a) / (b - a)));

    get("pdfValue").textContent =
      `f(${format(x)}) = ${format(density)}`;

    get("cdfValue").innerHTML =
      `<span>F(${format(x)}) = P(X ≤ ${format(x)})</span> ` +
      `<span>= ${format(probability)} (${format(probability * 100)}%)</span>`;

    // PDF
    const pdfMaximum = 0.3;
    const top = Y(height, pdfMaximum);

    let pdf = axes(pdfMaximum, [0, 0.125, 0.25]);

    pdf += `
      <rect
        x="${X(a)}"
        y="${top}"
        width="${X(b) - X(a)}"
        height="${220 - top}"
        fill="#36a7cf"
        fill-opacity="0.15"
      />

      <path
        d="
          M ${X(-1)} 220 H ${X(a)}
          M ${X(a)} ${top} H ${X(b)}
          M ${X(b)} 220 H ${X(5)}
        "
        fill="none"
        stroke="#278eaf"
        stroke-width="3"
      />
    `;

    [a, b].forEach(bound => {
      pdf += line(X(bound), 220, X(bound), top, "#8cb8ca", true);
    });

    pdf += line(X(x), 28, X(x), 220, "#16876f", true);

    pdf += `
      <circle
        cx="${X(x)}"
        cy="${Y(density, pdfMaximum)}"
        r="5"
        fill="#16876f"
      />
    `;

    get("pdf").innerHTML = pdf;

    // CDF
    const cdfMaximum = 1.1;
    const pointY = Y(probability, cdfMaximum);

    let cdf = axes(cdfMaximum, [0, 0.25, 0.5, 0.75, 1]);

    cdf += `
      <path
        d="
          M ${X(-1)} 220
          H ${X(a)}
          L ${X(b)} ${Y(1, cdfMaximum)}
          H ${X(5)}
        "
        fill="none"
        stroke="#278eaf"
        stroke-width="3"
      />
    `;

    cdf += line(X(x), 220, X(x), pointY, "#16876f", true);
    cdf += line(60, pointY, X(x), pointY, "#16876f", true);

    cdf += `
      <circle
        cx="${X(x)}"
        cy="${pointY}"
        r="6"
        fill="#16876f"
      />
    `;

    get("cdf").innerHTML = cdf;
  }

  get("x").addEventListener("input", update);
  update();
</script>
</body>
</html>
