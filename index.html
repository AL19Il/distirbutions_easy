<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uniform Distribution</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #203849;
      background: white;
    }

    main {
      max-width: 760px;
      margin: auto;
      padding: 20px;
    }

    h1 { font-size: 24px; margin-bottom: 8px; }
    h2 { font-size: 18px; margin-bottom: 6px; }
    p { color: #607585; }

    .control {
      padding: 16px;
      background: #f1f7fa;
      border-radius: 12px;
      margin: 20px 0;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }

    input {
      width: 100%;
      height: 44px;
      accent-color: #168aab;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .value {
      color: #16876f;
      font-variant-numeric: tabular-nums;
      margin-bottom: 4px;
    }

    section { margin-bottom: 24px; }

    @media (max-width: 480px) {
      main { padding: 12px; }
    }
  </style>
</head>

<body>
<main>
  <h1>Uniform Distribution</h1>
  <p>Fixed parameters: a = 0, b = 4</p>

  <div class="control">
    <label for="x">
      Move x
      <output id="xValue" for="x">2</output>
    </label>

    <input
      id="x"
      type="range"
      min="-1"
      max="5"
      step="0.05"
      value="2"
    >
  </div>

  <section>
    <h2>PDF — Probability Density</h2>
    <div class="value" id="pdfValue"></div>
    <svg
      id="pdf"
      viewBox="0 0 720 265"
      role="img"
      aria-label="Uniform probability density"
    ></svg>
  </section>

  <section>
    <h2>CDF — Cumulative Probability</h2>
    <div class="value" id="cdfValue" aria-live="polite"></div>
    <svg
      id="cdf"
      viewBox="0 0 720 265"
      role="img"
      aria-label="Uniform cumulative distribution"
    ></svg>
  </section>
</main>

<script>
  const a = 0;
  const b = 4;

  const get = id => document.getElementById(id);
  const format = value => Number(value.toFixed(3)).toString();

  // Fixed graph coordinates.
  const X = value => 60 + (value + 1) * 620 / 6;
  const Y = (value, maximum) => 220 - value * 180 / maximum;

  function line(x1, y1, x2, y2, color, dashed = false) {
    return `
      <line
        x1="${x1}" y1="${y1}"
        x2="${x2}" y2="${y2}"
        stroke="${color}"
        stroke-width="1.5"
        ${dashed ? 'stroke-dasharray="5 4"' : ""}
      />
    `;
  }

  function text(x, y, content, anchor = "middle") {
    return `
      <text
        x="${x}" y="${y}"
        text-anchor="${anchor}"
        font-family="Arial"
        font-size="15"
        fill="#607585"
      >${content}</text>
    `;
  }

  function axes(maximum, ticks) {
    let result = "";

    ticks.forEach(value => {
      const y = Y(value, maximum);
      result += line(60, y, 680, y, "#e0e8ed");
      result += text(49, y + 5, format(value), "end");
    });

    result += line(60, 220, 680, 220, "#718591");

    for (let value = -1; value <= 5; value++) {
      result += text(X(value), 245, value);
    }

    return result + text(700, 225, "t");
  }

  function update() {
    const x = Number(get("x").value);
    const height = 1 / (b - a);
    const density = x >= a && x <= b ? height : 0;

    const probability = Math.max(
      0,
      Math.min(1, (x - a) / (b - a))
    );

    get("xValue").textContent = format(x);

    get("pdfValue").textContent =
      `f(${format(x)}) = ${format(density)}`;

    get("cdfValue").textContent =
      `F(${format(x)}) = P(X ≤ ${format(x)}) = ` +
      `${format(probability)} (${format(probability * 100)}%)`;

    // PDF
    const pdfMaximum = 0.3;
    const top = Y(height, pdfMaximum);

    let pdf = axes(pdfMaximum, [0, 0.125, 0.25]);

    pdf += `
      <rect
        x="${X(a)}"
        y="${top}"
        width="${X(b) - X(a)}"
        height="${220 - top}"
        fill="#36a7cf"
        fill-opacity="0.15"
      />

      <path
        d="
          M ${X(-1)} 220 H ${X(a)}
          M ${X(a)} ${top} H ${X(b)}
          M ${X(b)} 220 H ${X(5)}
        "
        fill="none"
        stroke="#278eaf"
        stroke-width="3"
      />
    `;

    [a, b].forEach(bound => {
      pdf += line(
        X(bound), 220, X(bound), top, "#8cb8ca", true
      );
    });

    pdf += line(X(x), 28, X(x), 220, "#16876f", true);

    pdf += `
      <circle
        cx="${X(x)}"
        cy="${Y(density, pdfMaximum)}"
        r="5"
        fill="#16876f"
      />
    `;

    pdf += text(X(x), 20, `x = ${format(x)}`);
    get("pdf").innerHTML = pdf;

    // CDF
    const cdfMaximum = 1.1;
    const pointY = Y(probability, cdfMaximum);

    let cdf = axes(cdfMaximum, [0, 0.25, 0.5, 0.75, 1]);

    cdf += `
      <path
        d="
          M ${X(-1)} 220
          H ${X(a)}
          L ${X(b)} ${Y(1, cdfMaximum)}
          H ${X(5)}
        "
        fill="none"
        stroke="#278eaf"
        stroke-width="3"
      />
    `;

    cdf += line(X(x), 220, X(x), pointY, "#16876f", true);
    cdf += line(60, pointY, X(x), pointY, "#16876f", true);

    cdf += `
      <circle
        cx="${X(x)}"
        cy="${pointY}"
        r="6"
        fill="#16876f"
      />
    `;

    get("cdf").innerHTML = cdf;
  }

  get("x").addEventListener("input", update);
  update();
</script>
</body>
</html>
